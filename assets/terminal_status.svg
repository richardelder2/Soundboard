<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 490' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0b0f19'/>
      <stop offset='100%' stop-color='#111827'/>
    </linearGradient>
    <linearGradient id='barGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#1f2937'/>
      <stop offset='100%' stop-color='#374151'/>
    </linearGradient>
    <filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='14' stdDeviation='16' flood-color='#000000' flood-opacity='0.65'/>
    </filter>
  </defs>

  <style>
    .window { fill: url(#bgGrad); stroke: #374151; stroke-width: 1.2px; rx: 12px; }
    .titlebar { fill: url(#barGrad); rx: 12px 12px 0 0; }
    .dot-red { fill: #ef4444; }
    .dot-yellow { fill: #f59e0b; }
    .dot-green { fill: #10b981; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #9ca3af; text-anchor: middle; font-weight: 600; letter-spacing: 0.3px; }
    .code { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    .prompt { fill: #60a5fa; font-weight: 700; }
    .cmd { fill: #f9fafb; font-weight: 600; }
    .dim { fill: #6b7280; }
    .header { fill: #34d399; font-weight: 700; letter-spacing: 0.5px; }
    .accent { fill: #c084fc; font-weight: 600; }
    .warn { fill: #fb923c; font-weight: 600; }
    .gold { fill: #fbbf24; font-weight: 600; }
    .text { fill: #e5e7eb; }
    .pass { fill: #34d399; font-weight: 700; }
  </style>

  <g filter='url(#shadow)'>
    <rect x='10' y='10' width='840' height='465' class='window'/>
    <path d='M 10 10 L 850 10 A 12 12 0 0 1 850 48 L 10 48 Z' class='titlebar'/>
    <circle cx='34' cy='29' r='6' class='dot-red'/>
    <circle cx='54' cy='29' r='6' class='dot-yellow'/>
    <circle cx='74' cy='29' r='6' class='dot-green'/>
    <text x='430' y='33' class='title'>soundboard status — Production Telemetry Console</text>

    <g transform='translate(32, 80)' class='code'>
      <text y='0'><tspan class='prompt'>author@soundboard-studio</tspan><tspan class='dim'>:~$</tspan> <tspan class='cmd'>soundboard status</tspan></text>
      
      <text y='32' class='header'>[SAGA PRODUCTION PIPELINE]</text>
      <text y='54' class='text'>  Stage 01 · Onboarding         <tspan class='pass'>✔ COMPLETE</tspan>   <tspan class='dim'>(Bible, Cast, Trope Stack, Allowlist)</tspan></text>
      <text y='74' class='text'>  Stage 02 · Planning           <tspan class='pass'>✔ COMPLETE</tspan>   <tspan class='dim'>(Foolscap, Obligatory Ledger, Beats)</tspan></text>
      <text y='94' class='text'>  Stage 03 · Drafting           <tspan class='accent'>● ACTIVE</tspan>     <tspan class='dim'>(Ch 04 in progress: 3,240 / 3,500w)</tspan></text>
      <text y='114' class='text'>  Stage 04 · Diagnostics        <tspan class='dim'>○ PENDING</tspan>    <tspan class='dim'>(3 passed / 1 queued for audit)</tspan></text>
      <text y='134' class='text'>  Stage 05 · Publishing         <tspan class='dim'>○ GATED</tspan>      <tspan class='dim'>(Locked until all chapters pass)</tspan></text>

      <text y='168' class='header'>[MANUSCRIPT PRODUCTION LEDGER]</text>
      <text y='190' class='dim'>  CH   TITLE                  POV            TARGET    ACTUAL    STATUS    QUALITY GATE</text>
      <text y='210' class='text'>  01   The Clockwork Foundry  Kaelen Vance   3,500w    3,620w   <tspan class='pass'>passed</tspan>    <tspan class='pass'>[4/4 PASS]</tspan> ✔</text>
      <text y='230' class='text'>  02   Whispers in the Brass  Elena Mor      3,200w    3,310w   <tspan class='pass'>passed</tspan>    <tspan class='pass'>[4/4 PASS]</tspan> ✔</text>
      <text y='250' class='text'>  03   The Smuggler's Key     Kaelen Vance   3,800w    3,745w   <tspan class='pass'>passed</tspan>    <tspan class='pass'>[4/4 PASS]</tspan> ✔</text>
      <text y='270' class='text'>  04   Subterranean Vault     Elena Mor      3,500w    3,240w   <tspan class='accent'>drafted</tspan>   <tspan class='gold'>[AWAIT-AUD]</tspan> ⏳</text>

      <text y='306' class='header'>[TELEMETRY &amp; CRAFT METRICS]</text>
      <text y='328' class='text'>  Total Words: <tspan class='gold'>13,915</tspan> / 85,000  ·  Avg Cadence: <tspan class='pass'>14.6 w/s</tspan>  ·  Canon Truths: <tspan class='pass'>84 verified</tspan></text>

      <text y='358' class='header'>[CONCIERGE NEXT ACTION]</text>
      <text y='380' class='text'>  Execute <tspan class='cmd'>soundboard audit stages/03_drafting/output/chapters/ch04.md</tspan></text>
    </g>
  </g>
</svg>
