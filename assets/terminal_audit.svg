<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 510' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgGradAudit' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0b0f19'/>
      <stop offset='100%' stop-color='#111827'/>
    </linearGradient>
    <linearGradient id='barGradAudit' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#1f2937'/>
      <stop offset='100%' stop-color='#374151'/>
    </linearGradient>
    <filter id='shadowAudit' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='14' stdDeviation='16' flood-color='#000000' flood-opacity='0.65'/>
    </filter>
  </defs>

  <style>
    .window { fill: url(#bgGradAudit); stroke: #374151; stroke-width: 1.2px; rx: 12px; }
    .titlebar { fill: url(#barGradAudit); rx: 12px 12px 0 0; }
    .dot-red { fill: #ef4444; }
    .dot-yellow { fill: #f59e0b; }
    .dot-green { fill: #10b981; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #9ca3af; text-anchor: middle; font-weight: 600; letter-spacing: 0.3px; }
    .code { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    .prompt { fill: #60a5fa; font-weight: 700; }
    .cmd { fill: #f9fafb; font-weight: 600; }
    .dim { fill: #6b7280; }
    .header { fill: #38bdf8; font-weight: 700; letter-spacing: 0.5px; }
    .accent { fill: #c084fc; font-weight: 600; }
    .warn { fill: #fb923c; font-weight: 600; }
    .gold { fill: #fbbf24; font-weight: 600; }
    .text { fill: #e5e7eb; }
    .pass { fill: #34d399; font-weight: 700; }
    .box { fill: #1e293b; stroke: #334155; rx: 6px; }
  </style>

  <g filter='url(#shadowAudit)'>
    <rect x='10' y='10' width='840' height='485' class='window'/>
    <path d='M 10 10 L 850 10 A 12 12 0 0 1 850 48 L 10 48 Z' class='titlebar'/>
    <circle cx='34' cy='29' r='6' class='dot-red'/>
    <circle cx='54' cy='29' r='6' class='dot-yellow'/>
    <circle cx='74' cy='29' r='6' class='dot-green'/>
    <text x='430' y='33' class='title'>soundboard audit — 4-Gate Narrative Diagnostics</text>

    <g transform='translate(32, 80)' class='code'>
      <text y='0'><tspan class='prompt'>author@soundboard-studio</tspan><tspan class='dim'>:~$</tspan> <tspan class='cmd'>soundboard audit stages/03_drafting/output/chapters/ch03.md</tspan></text>
      
      <text y='32' class='header'>[AUDITING CHAPTER 03: "The Smuggler's Key" (3,745 words)]</text>
      
      <text y='62' class='text'>  [GATE 1/4] <tspan class='pass'>✔ PROSE RHYTHM &amp; CADENCE</tspan></text>
      <text y='82' class='dim'>    Sentence variance: standard dev 7.4 (healthy dynamic range)</text>
      <text y='100' class='dim'>    Average sentence length: 14.8 words · Paragraph burstiness: 84% natural</text>

      <text y='128' class='text'>  [GATE 2/4] <tspan class='pass'>✔ AI PROSE TELL DENSITY</tspan></text>
      <text y='148' class='dim'>    Tell frequency: 0.267 per 1,000w (threshold: &lt; 0.500) — <tspan class='pass'>CLEAN</tspan></text>
      <text y='166' class='dim'>    Filtered by allowlist: "gearwork", "clockwork", "aether" (3 world terms preserved)</text>

      <text y='194' class='text'>  [GATE 3/4] <tspan class='pass'>✔ CANON &amp; CONTINUITY INTEGRITY</tspan></text>
      <text y='214' class='dim'>    Proper nouns verified: 19 characters, 6 factions, 4 locations</text>
      <text y='232' class='dim'>    Contradiction checks: 0 conflicts detected against canon.md</text>

      <text y='260' class='text'>  [GATE 4/4] <tspan class='pass'>✔ REPETITION &amp; POV ADHERENCE</tspan></text>
      <text y='280' class='dim'>    Cross-chapter 4-gram repetition: 0 hits · POV drift: 0 breaches (Kaelen Vance)</text>
      <text y='298' class='dim'>    Obligatory Trope Scene: "The Black Market Bargain" delivered</text>

      <text y='336' class='box' x='0' height='56' width='796'/>
      <text y='360' x='18' class='pass'>  VERDICT: [4/4 GATES PASSED] — CHAPTER READY FOR PRODUCTION GATE</text>
      <text y='380' x='18' class='dim'>  Report written: stages/04_diagnostics_edits/output/reports/ch03_audit.md</text>

      <text y='414' class='header'>[NEXT CONCRETE ACTION]</text>
      <text y='434' class='text'>  Chapter 03 status updated to <tspan class='pass'>passed</tspan> in manuscript.json. Proceed to Chapter 04 drafting.</text>
    </g>
  </g>
</svg>
