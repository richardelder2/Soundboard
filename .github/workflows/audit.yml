name: Soundboard Audit & Catalog Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Workspace Status & Stage Integrity
        run: node scripts/soundboard.js status

      - name: Verify OKF Craft Catalog Index
        run: node scripts/soundboard.js okf-index

      - name: Test Craft Search Engine
        run: node scripts/soundboard.js craft search "theory of mind"
